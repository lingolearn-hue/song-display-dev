<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#111214"/>

  <!-- Guitar body — lower bout -->
  <ellipse cx="256" cy="340" rx="118" ry="105" fill="#c8853a"/>
  <!-- Guitar body — upper bout -->
  <ellipse cx="256" cy="210" rx="88" ry="80" fill="#c8853a"/>
  <!-- Waist cutaway -->
  <rect x="168" y="245" width="176" height="50" fill="#111214"/>
  <!-- Redraw waist curves -->
  <ellipse cx="200" cy="270" rx="40" ry="32" fill="#c8853a"/>
  <ellipse cx="312" cy="270" rx="40" ry="32" fill="#c8853a"/>

  <!-- Body outline -->
  <ellipse cx="256" cy="340" rx="118" ry="105" fill="none" stroke="#e8a050" stroke-width="6"/>
  <ellipse cx="256" cy="210" rx="88" ry="80" fill="none" stroke="#e8a050" stroke-width="6"/>

  <!-- Sound hole -->
  <circle cx="256" cy="290" r="38" fill="#111214"/>
  <circle cx="256" cy="290" r="38" fill="none" stroke="#e8a050" stroke-width="5"/>
  <circle cx="256" cy="290" r="28" fill="none" stroke="#7eb8f7" stroke-width="2" opacity="0.5"/>

  <!-- Neck -->
  <rect x="236" y="58" width="40" height="160" rx="8" fill="#b07030"/>
  <rect x="236" y="58" width="40" height="160" rx="8" fill="none" stroke="#e8a050" stroke-width="3"/>

  <!-- Frets -->
  <line x1="236" y1="100" x2="276" y2="100" stroke="#e8d090" stroke-width="3"/>
  <line x1="236" y1="130" x2="276" y2="130" stroke="#e8d090" stroke-width="3"/>
  <line x1="236" y1="160" x2="276" y2="160" stroke="#e8d090" stroke-width="3"/>
  <line x1="236" y1="190" x2="276" y2="190" stroke="#e8d090" stroke-width="3"/>

  <!-- Nut -->
  <rect x="234" y="74" width="44" height="7" rx="2" fill="#e8d090"/>

  <!-- Headstock -->
  <rect x="228" y="36" width="56" height="44" rx="10" fill="#b07030"/>
  <rect x="228" y="36" width="56" height="44" rx="10" fill="none" stroke="#e8a050" stroke-width="3"/>

  <!-- Tuning pegs -->
  <circle cx="236" cy="46" r="5" fill="#e8d090"/>
  <circle cx="236" cy="62" r="5" fill="#e8d090"/>
  <circle cx="276" cy="46" r="5" fill="#e8d090"/>
  <circle cx="276" cy="62" r="5" fill="#e8d090"/>
  <circle cx="256" cy="40" r="5" fill="#e8d090"/>
  <circle cx="256" cy="70" r="5" fill="#e8d090"/>

  <!-- Strings (6) -->
  <line x1="241" y1="76" x2="230" y2="445" stroke="#7eb8f7" stroke-width="1.2" opacity="0.9"/>
  <line x1="246" y1="76" x2="238" y2="445" stroke="#7eb8f7" stroke-width="1.4" opacity="0.9"/>
  <line x1="251" y1="76" x2="246" y2="445" stroke="#7eb8f7" stroke-width="1.6" opacity="0.9"/>
  <line x1="261" y1="76" x2="266" y2="445" stroke="#7eb8f7" stroke-width="1.6" opacity="0.9"/>
  <line x1="266" y1="76" x2="274" y2="445" stroke="#7eb8f7" stroke-width="1.4" opacity="0.9"/>
  <line x1="271" y1="76" x2="282" y2="445" stroke="#7eb8f7" stroke-width="1.2" opacity="0.9"/>

  <!-- Bridge -->
  <rect x="222" y="380" width="68" height="12" rx="4" fill="#b07030" stroke="#e8a050" stroke-width="2"/>

  <!-- Bridge pins -->
  <circle cx="237" cy="383" r="3" fill="#e8d090"/>
  <circle cx="247" cy="383" r="3" fill="#e8d090"/>
  <circle cx="256" cy="383" r="3" fill="#e8d090"/>
  <circle cx="265" cy="383" r="3" fill="#e8d090"/>
  <circle cx="275" cy="383" r="3" fill="#e8d090"/>
</svg>
